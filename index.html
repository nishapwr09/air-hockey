<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Air Hockey</title>
    <meta name="description" content="A single-file HTML5 Air Hockey game featuring smart AI, realistic 2D physics, neon arcade visuals, and Web Audio effects." />
    <meta property="og:title" content="Air Hockey" />
    <meta property="og:description" content="A single-file HTML5 Air Hockey game featuring smart AI, realistic 2D physics, neon arcade visuals, and Web Audio effects." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      :root {
        --bg-color: #06080e;
        --table-bg: #0b111e;
        --cyan-glow: #00f3ff;
        --red-glow: #ff2a5f;
        --amber-glow: #ffb703;
        --white-puck: #f8fafc;
        --font-display: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-color);
        font-family: var(--font-display);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 8px;
      }

      /* Scoreboard HUD */
      #hud {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(11, 17, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 243, 255, 0.1);
        border-radius: 40px;
        padding: 6px 20px;
        gap: 16px;
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      .hud-score-card {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .hud-label.ai {
        color: var(--red-glow);
        text-shadow: 0 0 8px rgba(255, 42, 95, 0.6);
      }

      .hud-label.player {
        color: var(--cyan-glow);
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
      }

      .hud-score {
        font-size: 26px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .hud-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .hud-target {
        font-size: 11px;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 600;
      }

      .hud-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #cbd5e1;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .hud-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        transform: scale(1.05);
      }

      /* Game Canvas */
      #canvas-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(0, 243, 255, 0.15), 0 0 70px rgba(0, 0, 0, 0.85);
        border-radius: 28px;
        touch-action: none;
      }

      #game-canvas {
        display: block;
        border-radius: 26px;
        background: var(--table-bg);
        cursor: crosshair;
        touch-action: none;
      }

      /* Modal Overlays (Start, Pause, Game Over) */
      .game-overlay {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: rgba(5, 8, 15, 0.86);
        backdrop-filter: blur(14px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }

      .game-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .modal-box {
        width: 100%;
        max-width: 400px;
        background: rgba(14, 20, 36, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 243, 255, 0.12);
        border-radius: 20px;
        padding: 32px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .modal-title {
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #00f3ff 20%, #ffffff 50%, #ff2a5f 80%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        margin-bottom: 2px;
      }

      .modal-subtitle {
        font-size: 14px;
        color: #94a3b8;
        letter-spacing: 0.5px;
        line-height: 1.4;
      }

      .section-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: left;
      }

      .section-label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #64748b;
      }

      .pill-selector {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 100%;
      }

      .pill-selector.two-col {
        grid-template-columns: repeat(2, 1fr);
      }

      .pill-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #94a3b8;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 10px 8px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pill-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .pill-btn.active {
        background: rgba(0, 243, 255, 0.18);
        border-color: var(--cyan-glow);
        color: #ffffff;
        box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
      }

      .primary-btn {
        width: 100%;
        background: linear-gradient(135deg, #00d2ff 0%, #0099ff 100%);
        border: none;
        color: #050811;
        font-family: inherit;
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 14px 28px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.5), 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(0, 210, 255, 0.7), 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      .primary-btn:active {
        transform: translateY(1px);
      }

      .secondary-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f1f5f9;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .secondary-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }

      /* In-game floating Goal Banner */
      #goal-banner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.6);
        z-index: 30;
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: #fff;
        opacity: 0;
        pointer-events: none;
        transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
        text-shadow: 0 0 30px #ff2a5f, 0 0 60px #ff2a5f;
      }

      #goal-banner.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      #goal-banner.player-goal {
        color: #00f3ff;
        text-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff;
      }

      .control-hint {
        font-size: 12px;
        color: #64748b;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- HUD Scoreboard -->
      <div id="hud">
        <div class="hud-score-card">
          <span class="hud-label ai">AI</span>
          <span id="ai-score" class="hud-score" style="color: var(--red-glow);">0</span>
        </div>

        <div class="hud-center">
          <span class="hud-target">FIRST TO <span id="target-score-display">7</span></span>
        </div>

        <div class="hud-score-card">
          <span id="player-score" class="hud-score" style="color: var(--cyan-glow);">0</span>
          <span class="hud-label player">YOU</span>
        </div>

        <button id="sound-btn" class="hud-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <svg id="sound-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>

        <button id="pause-btn" class="hud-btn" title="Pause Game" aria-label="Pause Game">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>
      </div>

      <!-- Canvas Frame -->
      <div id="canvas-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="goal-banner">GOAL!</div>
      </div>

      <!-- Start Screen Modal -->
      <div id="start-overlay" class="game-overlay">
        <div class="modal-box">
          <div>
            <h1 class="modal-title">AIR HOCKEY</h1>
            <p class="modal-subtitle">Fast-paced retro arcade table hockey</p>
          </div>

          <div class="section-group">
            <span class="section-label">AI Difficulty</span>
            <div class="pill-selector">
              <button class="pill-btn" data-diff="easy">EASY</button>
              <button class="pill-btn active" data-diff="medium">MEDIUM</button>
              <button class="pill-btn" data-diff="hard">HARD</button>
            </div>
          </div>

          <div class="section-group">
            <span class="section-label">Target Score</span>
            <div class="pill-selector two-col">
              <button class="pill-btn" data-target="5">FIRST TO 5</button>
              <button class="pill-btn active" data-target="7">FIRST TO 7</button>
            </div>
          </div>

          <button id="start-game-btn" class="primary-btn">Start Game</button>
          <div class="control-hint">Control player mallet with mouse or touch drag</div>
        </div>
      </div>

      <!-- Pause Modal -->
      <div id="pause-overlay" class="game-overlay hidden">
        <div class="modal-box">
          <div>
            <h2 class="modal-title" style="font-size: 32px;">PAUSED</h2>
            <p class="modal-subtitle">Take a breather</p>
          </div>

          <div class="section-group">
            <span class="section-label">Change AI Difficulty</span>
            <div class="pill-selector">
              <button class="pill-btn" data-diff="easy">EASY</button>
              <button class="pill-btn active" data-diff="medium">MEDIUM</button>
              <button class="pill-btn" data-diff="hard">HARD</button>
            </div>
          </div>

          <button id="resume-btn" class="primary-btn">Resume</button>
          <button id="restart-match-btn" class="secondary-btn">Restart Match</button>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div id="gameover-overlay" class="game-overlay hidden">
        <div class="modal-box">
          <div>
            <h2 id="gameover-title" class="modal-title">YOU WIN!</h2>
            <p id="gameover-desc" class="modal-subtitle">Final Match Score</p>
          </div>

          <div style="font-size: 44px; font-weight: 900; letter-spacing: 4px; display: flex; align-items: center; gap: 14px;">
            <span id="final-player-score" style="color: var(--cyan-glow);">7</span>
            <span style="color: #64748b; font-size: 28px;">-</span>
            <span id="final-ai-score" style="color: var(--red-glow);">4</span>
          </div>

          <button id="play-again-btn" class="primary-btn">Play Again</button>
        </div>
      </div>
    </div>

    <script>
      /**
       * AIR HOCKEY - Complete HTML5 Canvas Physics Game
       * Zero external dependencies. Native Web Audio API sounds.
       */

      // --- WEB AUDIO SYNTHESIZER ---
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        playHit(force = 1) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          const clampedForce = Math.min(Math.max(force, 0.4), 2.2);
          const startFreq = 340 * clampedForce;
          const endFreq = 65;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(startFreq, now);
          osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

          gain.gain.setValueAtTime(0.35 * Math.min(clampedForce, 1.2), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.1);

          // Click transient
          const clickOsc = this.ctx.createOscillator();
          const clickGain = this.ctx.createGain();
          clickOsc.type = 'sine';
          clickOsc.frequency.setValueAtTime(900, now);
          clickOsc.frequency.exponentialRampToValueAtTime(120, now + 0.02);
          clickGain.gain.setValueAtTime(0.2, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          clickOsc.connect(clickGain);
          clickGain.connect(this.ctx.destination);
          clickOsc.start(now);
          clickOsc.stop(now + 0.03);
        }

        playBounce() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.06);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.07);
        }

        playGoal() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          // Arcade celebratory arpeggio + buzz
          const notes = [261.63, 329.63, 392.00, 523.25, 659.25];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);

            gain.gain.setValueAtTime(0.18, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.4);
          });

          // Sub bass rumble
          const bass = this.ctx.createOscillator();
          const bassGain = this.ctx.createGain();
          bass.type = 'triangle';
          bass.frequency.setValueAtTime(110, now);
          bass.frequency.exponentialRampToValueAtTime(40, now + 0.6);
          bassGain.gain.setValueAtTime(0.35, now);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          bass.connect(bassGain);
          bassGain.connect(this.ctx.destination);
          bass.start(now);
          bass.stop(now + 0.75);
        }

        playClick() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      }

      // --- GAME CONSTANTS & CONFIGURATION ---
      const VIRTUAL_WIDTH = 480;
      const VIRTUAL_HEIGHT = 800;

      // Table Boundary Coordinates
      const WALL = {
        left: 26,
        right: VIRTUAL_WIDTH - 26,
        top: 26,
        bottom: VIRTUAL_HEIGHT - 26,
        center: VIRTUAL_HEIGHT / 2
      };

      const GOAL_WIDTH = 160;
      const GOAL_LEFT = (VIRTUAL_WIDTH - GOAL_WIDTH) / 2; // 160
      const GOAL_RIGHT = GOAL_LEFT + GOAL_WIDTH;          // 320
      const GOAL_DEPTH = 30;

      const AI_PROFILES = {
        easy: {
          maxSpeed: 5.0,
          reactionDelay: 0.12,
          anticipation: 0.3,
          attackDistance: 130,
          errorFactor: 24,
          strikePower: 0.8
        },
        medium: {
          maxSpeed: 8.5,
          reactionDelay: 0.22,
          anticipation: 0.65,
          attackDistance: 220,
          errorFactor: 10,
          strikePower: 1.15
        },
        hard: {
          maxSpeed: 13.0,
          reactionDelay: 0.38,
          anticipation: 0.95,
          attackDistance: 320,
          errorFactor: 2,
          strikePower: 1.45
        }
      };

      // --- GAME STATE CLASS ---
      class AirHockeyGame {
        constructor() {
          this.canvas = document.getElementById('game-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.sound = new SoundEngine();

          // Scale & DPI
          this.scale = 1;
          this.dpr = window.devicePixelRatio || 1;
          this.offset = { x: 0, y: 0 };

          // Game Logic
          this.state = 'START'; // 'START', 'PLAYING', 'GOAL_PAUSE', 'PAUSED', 'GAME_OVER'
          this.difficulty = 'medium';
          this.targetScore = 7;
          this.playerScore = 0;
          this.aiScore = 0;
          this.goalTimer = 0;
          this.shake = 0;

          // Entities
          this.puck = {
            x: VIRTUAL_WIDTH / 2,
            y: VIRTUAL_HEIGHT / 2,
            vx: 0,
            vy: 0,
            radius: 15,
            trail: []
          };

          this.player = {
            x: VIRTUAL_WIDTH / 2,
            y: VIRTUAL_HEIGHT * 0.82,
            vx: 0,
            vy: 0,
            targetX: VIRTUAL_WIDTH / 2,
            targetY: VIRTUAL_HEIGHT * 0.82,
            radius: 28
          };

          this.ai = {
            x: VIRTUAL_WIDTH / 2,
            y: VIRTUAL_HEIGHT * 0.18,
            vx: 0,
            vy: 0,
            targetX: VIRTUAL_WIDTH / 2,
            targetY: VIRTUAL_HEIGHT * 0.18,
            radius: 28,
            defendHomeY: VIRTUAL_HEIGHT * 0.15,
            strikeCooldown: 0
          };

          this.particles = [];
          this.lastTime = performance.now();

          // Input tracking
          this.isPointerDown = false;

          this.initDOM();
          this.bindEvents();
          this.resize();
          this.loop = this.loop.bind(this);
          requestAnimationFrame(this.loop);
        }

        initDOM() {
          this.ui = {
            playerScore: document.getElementById('player-score'),
            aiScore: document.getElementById('ai-score'),
            targetScoreDisplay: document.getElementById('target-score-display'),
            startOverlay: document.getElementById('start-overlay'),
            pauseOverlay: document.getElementById('pause-overlay'),
            gameoverOverlay: document.getElementById('gameover-overlay'),
            gameoverTitle: document.getElementById('gameover-title'),
            finalPlayerScore: document.getElementById('final-player-score'),
            finalAiScore: document.getElementById('final-ai-score'),
            goalBanner: document.getElementById('goal-banner'),
            soundBtn: document.getElementById('sound-btn'),
            pauseBtn: document.getElementById('pause-btn'),
            soundIcon: document.getElementById('sound-icon')
          };
        }

        bindEvents() {
          window.addEventListener('resize', () => this.resize());

          // Input tracking: mouse & touch
          const updatePointer = (clientX, clientY) => {
            const rect = this.canvas.getBoundingClientRect();
            const rawX = (clientX - rect.left) / this.scale;
            const rawY = (clientY - rect.top) / this.scale;

            // Constrain player movement strictly to the bottom half of the table
            const minX = WALL.left + this.player.radius;
            const maxX = WALL.right - this.player.radius;
            const minY = WALL.center + this.player.radius + 6;
            const maxY = WALL.bottom - this.player.radius;

            this.player.targetX = Math.max(minX, Math.min(maxX, rawX));
            this.player.targetY = Math.max(minY, Math.min(maxY, rawY));
          };

          this.canvas.addEventListener('mousemove', (e) => {
            if (this.state === 'PLAYING') {
              updatePointer(e.clientX, e.clientY);
            }
          });

          this.canvas.addEventListener('mousedown', (e) => {
            this.sound.init();
            this.isPointerDown = true;
            if (this.state === 'PLAYING') {
              updatePointer(e.clientX, e.clientY);
            }
          });

          window.addEventListener('mouseup', () => {
            this.isPointerDown = false;
          });

          // Touch Handling
          this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.sound.init();
            if (e.touches.length > 0) {
              const t = e.touches[0];
              updatePointer(t.clientX, t.clientY);
            }
          }, { passive: false });

          this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
              const t = e.touches[0];
              updatePointer(t.clientX, t.clientY);
            }
          }, { passive: false });

          this.canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
          }, { passive: false });

          // Start Screen Controls
          document.getElementById('start-game-btn').addEventListener('click', () => {
            this.sound.playClick();
            this.startMatch();
          });

          // Pause Controls
          this.ui.pauseBtn.addEventListener('click', () => {
            if (this.state === 'PLAYING') {
              this.state = 'PAUSED';
              this.ui.pauseOverlay.classList.remove('hidden');
              this.sound.playClick();
            }
          });

          document.getElementById('resume-btn').addEventListener('click', () => {
            if (this.state === 'PAUSED') {
              this.state = 'PLAYING';
              this.ui.pauseOverlay.classList.add('hidden');
              this.sound.playClick();
            }
          });

          document.getElementById('restart-match-btn').addEventListener('click', () => {
            this.ui.pauseOverlay.classList.add('hidden');
            this.startMatch();
            this.sound.playClick();
          });

          // Game Over Controls
          document.getElementById('play-again-btn').addEventListener('click', () => {
            this.ui.gameoverOverlay.classList.add('hidden');
            this.ui.startOverlay.classList.remove('hidden');
            this.sound.playClick();
          });

          // Sound Toggle
          this.ui.soundBtn.addEventListener('click', () => {
            const isMuted = this.sound.toggleMute();
            this.ui.soundBtn.style.opacity = isMuted ? '0.5' : '1';
            this.ui.soundIcon.style.stroke = isMuted ? '#94a3b8' : '#00f3ff';
          });

          // Difficulty Selector Pills
          document.querySelectorAll('.pill-btn[data-diff]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              this.sound.playClick();
              document.querySelectorAll('.pill-btn[data-diff]').forEach(b => b.classList.remove('active'));
              const diff = e.currentTarget.getAttribute('data-diff');
              this.difficulty = diff;
              document.querySelectorAll(`.pill-btn[data-diff="${diff}"]`).forEach(b => b.classList.add('active'));
            });
          });

          // Target Score Selector Pills
          document.querySelectorAll('.pill-btn[data-target]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              this.sound.playClick();
              document.querySelectorAll('.pill-btn[data-target]').forEach(b => b.classList.remove('active'));
              e.currentTarget.classList.add('active');
              this.targetScore = parseInt(e.currentTarget.getAttribute('data-target'), 10);
              this.ui.targetScoreDisplay.textContent = this.targetScore;
            });
          });
        }

        resize() {
          const container = document.getElementById('game-container');
          const availableW = container.clientWidth - 16;
          const availableH = container.clientHeight - 80;

          // Scale respecting aspect ratio
          const scaleW = availableW / VIRTUAL_WIDTH;
          const scaleH = availableH / VIRTUAL_HEIGHT;
          this.scale = Math.min(scaleW, scaleH, 1.4);

          const displayW = Math.floor(VIRTUAL_WIDTH * this.scale);
          const displayH = Math.floor(VIRTUAL_HEIGHT * this.scale);

          this.canvas.style.width = `${displayW}px`;
          this.canvas.style.height = `${displayH}px`;

          this.dpr = window.devicePixelRatio || 1;
          this.canvas.width = Math.floor(displayW * this.dpr);
          this.canvas.height = Math.floor(displayH * this.dpr);

          this.ctx.setTransform(1, 0, 0, 1, 0, 0);
          this.ctx.scale(this.dpr * this.scale, this.dpr * this.scale);
        }

        startMatch() {
          this.playerScore = 0;
          this.aiScore = 0;
          this.updateScoreboard();
          this.ui.targetScoreDisplay.textContent = this.targetScore;

          this.ui.startOverlay.classList.add('hidden');
          this.ui.pauseOverlay.classList.add('hidden');
          this.ui.gameoverOverlay.classList.add('hidden');

          this.resetTable('player');
          this.state = 'PLAYING';
        }

        resetTable(serveTo = 'player') {
          // Reset puck position with gentle drift towards serving side
          this.puck.x = VIRTUAL_WIDTH / 2;
          this.puck.y = VIRTUAL_HEIGHT / 2;
          this.puck.vx = (Math.random() - 0.5) * 1.5;
          this.puck.vy = serveTo === 'player' ? 2.5 : -2.5;
          this.puck.trail = [];

          // Reset paddles
          this.player.x = VIRTUAL_WIDTH / 2;
          this.player.y = VIRTUAL_HEIGHT * 0.82;
          this.player.targetX = this.player.x;
          this.player.targetY = this.player.y;
          this.player.vx = 0;
          this.player.vy = 0;

          this.ai.x = VIRTUAL_WIDTH / 2;
          this.ai.y = VIRTUAL_HEIGHT * 0.18;
          this.ai.targetX = this.ai.x;
          this.ai.targetY = this.ai.y;
          this.ai.vx = 0;
          this.ai.vy = 0;
        }

        updateScoreboard() {
          this.ui.playerScore.textContent = this.playerScore;
          this.ui.aiScore.textContent = this.aiScore;
        }

        spawnSparks(x, y, color = '#00f3ff', count = 12) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 5.5;
            this.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              radius: 1.5 + Math.random() * 2,
              color,
              alpha: 1,
              decay: 0.03 + Math.random() * 0.04
            });
          }
        }

        spawnGoalExplosion(isPlayerGoal) {
          const count = 50;
          const color = isPlayerGoal ? '#00f3ff' : '#ff2a5f';
          const goalY = isPlayerGoal ? WALL.top : WALL.bottom;
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 8;
            this.particles.push({
              x: GOAL_LEFT + Math.random() * GOAL_WIDTH,
              y: goalY,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              radius: 2 + Math.random() * 3,
              color: Math.random() > 0.3 ? color : '#ffffff',
              alpha: 1,
              decay: 0.015 + Math.random() * 0.02
            });
          }
        }

        triggerGoal(scorer) {
          this.state = 'GOAL_PAUSE';
          this.goalTimer = 75; // ~1.2 seconds at 60fps
          this.shake = 16;
          this.sound.playGoal();

          const isPlayer = scorer === 'player';
          if (isPlayer) {
            this.playerScore++;
            this.ui.goalBanner.textContent = "YOU SCORED!";
            this.ui.goalBanner.className = "show player-goal";
          } else {
            this.aiScore++;
            this.ui.goalBanner.textContent = "AI SCORED!";
            this.ui.goalBanner.className = "show";
          }

          this.updateScoreboard();
          this.spawnGoalExplosion(isPlayer);

          // Check Win Condition
          if (this.playerScore >= this.targetScore || this.aiScore >= this.targetScore) {
            setTimeout(() => {
              this.handleMatchOver();
            }, 1200);
          }
        }

        handleMatchOver() {
          this.state = 'GAME_OVER';
          this.ui.goalBanner.className = "";
          const playerWon = this.playerScore >= this.targetScore;

          this.ui.gameoverTitle.textContent = playerWon ? "YOU WIN!" : "AI WINS!";
          this.ui.gameoverTitle.style.background = playerWon
            ? 'linear-gradient(135deg, #00f3ff, #fff)'
            : 'linear-gradient(135deg, #ff2a5f, #fff)';
          this.ui.gameoverTitle.style.webkitBackgroundClip = 'text';

          this.ui.finalPlayerScore.textContent = this.playerScore;
          this.ui.finalAiScore.textContent = this.aiScore;

          this.ui.gameoverOverlay.classList.remove('hidden');
        }

        // --- AI LOGIC (3-Tier Difficulty) ---
        updateAI() {
          const profile = AI_PROFILES[this.difficulty];
          const puck = this.puck;
          const ai = this.ai;

          let targetX = VIRTUAL_WIDTH / 2;
          let targetY = ai.defendHomeY;

          const puckInAIZone = puck.y < WALL.center;

          if (puckInAIZone) {
            // Puck is in AI's territory: determine attack or clear
            if (puck.y < ai.y) {
              // Puck slipped behind AI: retreat quickly to defend goal mouth
              targetX = puck.x;
              targetY = WALL.top + ai.radius + 12;
            } else {
              // Position strategically to strike puck toward player goal corners
              const goalCornerX = puck.x > VIRTUAL_WIDTH / 2 ? GOAL_LEFT + 25 : GOAL_RIGHT - 25;
              const angleToGoal = Math.atan2(WALL.bottom - puck.y, goalCornerX - puck.x);

              // Strike behind puck aiming towards goal
              targetX = puck.x - Math.cos(angleToGoal) * (ai.radius + puck.radius + 6);
              targetY = puck.y - Math.sin(angleToGoal) * (ai.radius + puck.radius + 6);

              // Hard AI adds predictive bank-shot aiming
              if (this.difficulty === 'hard') {
                targetX += (puck.vx * 3.5);
                targetY += (puck.vy * 2.5);
              }
            }
          } else {
            // Puck is in player territory: AI defends goal center and shadows puck
            const predictOffset = (puck.x - VIRTUAL_WIDTH / 2) * profile.anticipation;
            targetX = VIRTUAL_WIDTH / 2 + predictOffset;
            targetY = ai.defendHomeY;

            // Follow puck x if moving toward AI
            if (puck.vy < -1) {
              targetX = puck.x + (Math.random() - 0.5) * profile.errorFactor;
            }
          }

          // Bound AI target within AI side
          const minX = WALL.left + ai.radius;
          const maxX = WALL.right - ai.radius;
          const minY = WALL.top + ai.radius;
          const maxY = WALL.center - ai.radius - 8;

          targetX = Math.max(minX, Math.min(maxX, targetX));
          targetY = Math.max(minY, Math.min(maxY, targetY));

          // Move AI towards target smoothly using difficulty speed
          const dx = targetX - ai.x;
          const dy = targetY - ai.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 1) {
            const speed = Math.min(dist * profile.reactionDelay, profile.maxSpeed);
            ai.vx = (dx / dist) * speed;
            ai.vy = (dy / dist) * speed;
          } else {
            ai.vx = 0;
            ai.vy = 0;
          }

          ai.x += ai.vx;
          ai.y += ai.vy;

          // Hard clamping to table boundaries
          ai.x = Math.max(minX, Math.min(maxX, ai.x));
          ai.y = Math.max(minY, Math.min(maxY, ai.y));
        }

        // --- PHYSICS & COLLISION ENGINE ---
        updatePhysics() {
          // 1. Update Player Movement (Smooth tracking with velocity calculation)
          const p = this.player;
          const pOldX = p.x;
          const pOldY = p.y;

          // Smooth easing towards target pointer
          p.x += (p.targetX - p.x) * 0.72;
          p.y += (p.targetY - p.y) * 0.72;

          p.vx = p.x - pOldX;
          p.vy = p.y - pOldY;

          // 2. Update AI
          this.updateAI();

          // 3. Sub-step Puck Physics (4 steps for anti-tunneling precision)
          const SUB_STEPS = 4;
          const puck = this.puck;
          const friction = Math.pow(0.993, 1 / SUB_STEPS);

          for (let step = 0; step < SUB_STEPS; step++) {
            puck.x += puck.vx / SUB_STEPS;
            puck.y += puck.vy / SUB_STEPS;
            puck.vx *= friction;
            puck.vy *= friction;

            // Clamp max velocity
            const currentSpeed = Math.hypot(puck.vx, puck.vy);
            const MAX_SPEED = 26;
            if (currentSpeed > MAX_SPEED) {
              puck.vx = (puck.vx / currentSpeed) * MAX_SPEED;
              puck.vy = (puck.vy / currentSpeed) * MAX_SPEED;
            }

            // Paddle-Puck Collisions
            this.handlePaddleCollision(puck, this.player, '#00f3ff', 1.0);
            this.handlePaddleCollision(puck, this.ai, '#ff2a5f', AI_PROFILES[this.difficulty].strikePower);

            // Wall Collisions
            this.handleWallCollisions(puck);
          }

          // Record trail for neon visual
          puck.trail.unshift({ x: puck.x, y: puck.y });
          if (puck.trail.length > 8) puck.trail.pop();
        }

        handlePaddleCollision(puck, paddle, sparkColor, powerMult = 1.0) {
          const dx = puck.x - paddle.x;
          const dy = puck.y - paddle.y;
          const dist = Math.hypot(dx, dy);
          const minDist = puck.radius + paddle.radius;

          if (dist < minDist && dist > 0) {
            // Collision normal
            const nx = dx / dist;
            const ny = dy / dist;

            // Separate overlapping circles
            puck.x = paddle.x + nx * minDist;
            puck.y = paddle.y + ny * minDist;

            // Relative velocity
            const rvx = puck.vx - paddle.vx;
            const rvy = puck.vy - paddle.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            // Only reflect if moving toward each other
            if (velAlongNormal < 0) {
              const restitution = 1.25;
              const impulse = -(1 + restitution) * velAlongNormal;

              puck.vx += nx * impulse + (paddle.vx * 0.7 * powerMult);
              puck.vy += ny * impulse + (paddle.vy * 0.7 * powerMult);

              const hitForce = Math.hypot(puck.vx, puck.vy) / 10;
              this.sound.playHit(hitForce);
              this.spawnSparks(puck.x, puck.y, sparkColor, 8);
              this.shake = Math.min(8, hitForce * 3);
            }
          }
        }

        handleWallCollisions(puck) {
          const bounceDamp = 0.94;

          // Left & Right non-goal walls
          if (puck.x - puck.radius < WALL.left) {
            puck.x = WALL.left + puck.radius;
            puck.vx = -puck.vx * bounceDamp;
            this.sound.playBounce();
            this.spawnSparks(puck.x, puck.y, '#94a3b8', 5);
          } else if (puck.x + puck.radius > WALL.right) {
            puck.x = WALL.right - puck.radius;
            puck.vx = -puck.vx * bounceDamp;
            this.sound.playBounce();
            this.spawnSparks(puck.x, puck.y, '#94a3b8', 5);
          }

          // Top Wall & AI Goal Logic
          if (puck.y - puck.radius < WALL.top) {
            const inGoalX = puck.x > GOAL_LEFT && puck.x < GOAL_RIGHT;
            if (inGoalX) {
              // Entering goal area
              if (puck.y < WALL.top - 12) {
                // Goal fully inside AI goal mouth -> Player Scores!
                this.triggerGoal('player');
                return;
              }
            } else {
              // Hits top wall outside goal
              puck.y = WALL.top + puck.radius;
              puck.vy = -puck.vy * bounceDamp;
              this.sound.playBounce();
              this.spawnSparks(puck.x, puck.y, '#94a3b8', 5);
            }
          }

          // Bottom Wall & Player Goal Logic
          if (puck.y + puck.radius > WALL.bottom) {
            const inGoalX = puck.x > GOAL_LEFT && puck.x < GOAL_RIGHT;
            if (inGoalX) {
              if (puck.y > WALL.bottom + 12) {
                // Goal fully inside Player net -> AI Scores!
                this.triggerGoal('ai');
                return;
              }
            } else {
              // Hits bottom wall outside goal
              puck.y = WALL.bottom - puck.radius;
              puck.vy = -puck.vy * bounceDamp;
              this.sound.playBounce();
              this.spawnSparks(puck.x, puck.y, '#94a3b8', 5);
            }
          }

          // Goal Post Collisions (Circle-Point collision for rounded goal posts)
          const posts = [
            { x: GOAL_LEFT, y: WALL.top },
            { x: GOAL_RIGHT, y: WALL.top },
            { x: GOAL_LEFT, y: WALL.bottom },
            { x: GOAL_RIGHT, y: WALL.bottom }
          ];

          for (const post of posts) {
            const pdx = puck.x - post.x;
            const pdy = puck.y - post.y;
            const pDist = Math.hypot(pdx, pdy);
            const postRadius = 6;
            if (pDist < puck.radius + postRadius && pDist > 0) {
              const pnx = pdx / pDist;
              const pny = pdy / pDist;
              puck.x = post.x + pnx * (puck.radius + postRadius);
              puck.y = post.y + pny * (puck.radius + postRadius);
              const dot = puck.vx * pnx + puck.vy * pny;
              if (dot < 0) {
                puck.vx -= 2 * dot * pnx;
                puck.vy -= 2 * dot * pny;
                this.sound.playBounce();
                this.spawnSparks(post.x, post.y, '#ffb703', 6);
              }
            }
          }
        }

        updateParticles() {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) {
              this.particles.splice(i, 1);
            }
          }
        }

        // --- RENDERING ENGINE ---
        draw() {
          const ctx = this.ctx;

          ctx.save();

          // Screen Shake
          if (this.shake > 0) {
            const sx = (Math.random() - 0.5) * this.shake;
            const sy = (Math.random() - 0.5) * this.shake;
            ctx.translate(sx, sy);
            this.shake *= 0.9;
            if (this.shake < 0.2) this.shake = 0;
          }

          // 1. Clear background & Table Bed
          ctx.fillStyle = '#0a0e19';
          ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

          this.drawTable(ctx);
          this.drawParticles(ctx);
          this.drawPuck(ctx);
          this.drawPaddle(ctx, this.ai, '#ff2a5f', '#ff809b');
          this.drawPaddle(ctx, this.player, '#00f3ff', '#80f9ff');

          ctx.restore();
        }

        drawTable(ctx) {
          // Subtle Ice grid/air hole dots
          ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
          const dotSpacing = 24;
          for (let x = WALL.left + 16; x < WALL.right; x += dotSpacing) {
            for (let y = WALL.top + 16; y < WALL.bottom; y += dotSpacing) {
              ctx.fillRect(x - 0.75, y - 0.75, 1.5, 1.5);
            }
          }

          // Outer Rink Rails with Neon Glow
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 14;
          ctx.strokeRect(WALL.left - 7, WALL.top - 7, (WALL.right - WALL.left) + 14, (WALL.bottom - WALL.top) + 14);

          // Neon Border Lines
          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(0, 243, 255, 0.3)';
          ctx.strokeStyle = 'rgba(0, 243, 255, 0.4)';
          ctx.lineWidth = 3;

          // Draw left and right side rails
          ctx.beginPath();
          ctx.moveTo(WALL.left, WALL.top);
          ctx.lineTo(WALL.left, WALL.bottom);
          ctx.moveTo(WALL.right, WALL.top);
          ctx.lineTo(WALL.right, WALL.bottom);
          ctx.stroke();

          // Top Wall rails outside goal
          ctx.beginPath();
          ctx.moveTo(WALL.left, WALL.top);
          ctx.lineTo(GOAL_LEFT, WALL.top);
          ctx.moveTo(GOAL_RIGHT, WALL.top);
          ctx.lineTo(WALL.right, WALL.top);
          ctx.stroke();

          // Bottom Wall rails outside goal
          ctx.beginPath();
          ctx.moveTo(WALL.left, WALL.bottom);
          ctx.lineTo(GOAL_LEFT, WALL.bottom);
          ctx.moveTo(GOAL_RIGHT, WALL.bottom);
          ctx.lineTo(WALL.right, WALL.bottom);
          ctx.stroke();

          ctx.shadowBlur = 0;

          // Goal Cavities
          // AI Goal (Top)
          ctx.fillStyle = 'rgba(255, 42, 95, 0.15)';
          ctx.fillRect(GOAL_LEFT, WALL.top - GOAL_DEPTH, GOAL_WIDTH, GOAL_DEPTH);
          ctx.strokeStyle = '#ff2a5f';
          ctx.lineWidth = 2;
          ctx.strokeRect(GOAL_LEFT, WALL.top - GOAL_DEPTH, GOAL_WIDTH, GOAL_DEPTH);

          // Player Goal (Bottom)
          ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
          ctx.fillRect(GOAL_LEFT, WALL.bottom, GOAL_WIDTH, GOAL_DEPTH);
          ctx.strokeStyle = '#00f3ff';
          ctx.lineWidth = 2;
          ctx.strokeRect(GOAL_LEFT, WALL.bottom, GOAL_WIDTH, GOAL_DEPTH);

          // Goal Posts (Pillars)
          const drawPost = (px, py, color) => {
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
          };
          drawPost(GOAL_LEFT, WALL.top, '#ff2a5f');
          drawPost(GOAL_RIGHT, WALL.top, '#ff2a5f');
          drawPost(GOAL_LEFT, WALL.bottom, '#00f3ff');
          drawPost(GOAL_RIGHT, WALL.bottom, '#00f3ff');

          // Center Line (Split Cyan / Red)
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 8]);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
          ctx.beginPath();
          ctx.moveTo(WALL.left, WALL.center);
          ctx.lineTo(WALL.right, WALL.center);
          ctx.stroke();
          ctx.setLineDash([]);

          // Center Circle & Spot
          ctx.lineWidth = 2;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.beginPath();
          ctx.arc(VIRTUAL_WIDTH / 2, WALL.center, 65, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(VIRTUAL_WIDTH / 2, WALL.center, 5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.fill();

          // Goal Area Creases
          // Top (AI)
          ctx.beginPath();
          ctx.arc(VIRTUAL_WIDTH / 2, WALL.top, 85, 0, Math.PI);
          ctx.strokeStyle = 'rgba(255, 42, 95, 0.25)';
          ctx.stroke();

          // Bottom (Player)
          ctx.beginPath();
          ctx.arc(VIRTUAL_WIDTH / 2, WALL.bottom, 85, Math.PI, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 243, 255, 0.25)';
          ctx.stroke();
        }

        drawPuck(ctx) {
          const puck = this.puck;

          // Glowing speed trail
          if (puck.trail.length > 1) {
            for (let i = 0; i < puck.trail.length - 1; i++) {
              const alpha = (1 - i / puck.trail.length) * 0.35;
              ctx.beginPath();
              ctx.arc(puck.trail[i].x, puck.trail[i].y, puck.radius * (1 - i * 0.08), 0, Math.PI * 2);
              ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`;
              ctx.fill();
            }
          }

          // Puck Outer Glow
          ctx.shadowBlur = 18;
          ctx.shadowColor = '#00f3ff';

          // Puck Body (Multi-ring plastic puck)
          const grad = ctx.createRadialGradient(
            puck.x - 3, puck.y - 3, 2,
            puck.x, puck.y, puck.radius
          );
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.5, '#e2e8f0');
          grad.addColorStop(1, '#94a3b8');

          ctx.beginPath();
          ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.shadowBlur = 0;

          // Inner grooved ring
          ctx.beginPath();
          ctx.arc(puck.x, puck.y, puck.radius * 0.6, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0, 243, 255, 0.6)';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Center pip
          ctx.beginPath();
          ctx.arc(puck.x, puck.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = '#00f3ff';
          ctx.fill();
        }

        drawPaddle(ctx, paddle, primaryColor, lightColor) {
          ctx.save();

          // Outer Mallet Ring & Glow
          ctx.shadowBlur = 16;
          ctx.shadowColor = primaryColor;

          const baseGrad = ctx.createRadialGradient(
            paddle.x, paddle.y, paddle.radius * 0.3,
            paddle.x, paddle.y, paddle.radius
          );
          baseGrad.addColorStop(0, '#1a2234');
          baseGrad.addColorStop(0.7, primaryColor);
          baseGrad.addColorStop(1, '#0b111e');

          ctx.beginPath();
          ctx.arc(paddle.x, paddle.y, paddle.radius, 0, Math.PI * 2);
          ctx.fillStyle = baseGrad;
          ctx.fill();

          ctx.shadowBlur = 0;

          // Highlighting rim
          ctx.beginPath();
          ctx.arc(paddle.x, paddle.y, paddle.radius - 2, 0, Math.PI * 2);
          ctx.strokeStyle = lightColor;
          ctx.lineWidth = 2;
          ctx.stroke();

          // Ergonomic central grip knob
          const knobRadius = paddle.radius * 0.52;
          const knobGrad = ctx.createRadialGradient(
            paddle.x - 3, paddle.y - 3, 1,
            paddle.x, paddle.y, knobRadius
          );
          knobGrad.addColorStop(0, lightColor);
          knobGrad.addColorStop(0.6, primaryColor);
          knobGrad.addColorStop(1, '#090d16');

          ctx.beginPath();
          ctx.arc(paddle.x, paddle.y, knobRadius, 0, Math.PI * 2);
          ctx.fillStyle = knobGrad;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(paddle.x, paddle.y, knobRadius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.restore();
        }

        drawParticles(ctx) {
          for (const p of this.particles) {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 6;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // --- MAIN GAME LOOP ---
        loop(timestamp) {
          const dt = (timestamp - this.lastTime) / 1000;
          this.lastTime = timestamp;

          if (this.state === 'PLAYING') {
            this.updatePhysics();
          } else if (this.state === 'GOAL_PAUSE') {
            this.updateParticles();
            this.goalTimer--;
            if (this.goalTimer <= 0) {
              this.ui.goalBanner.className = "";
              if (this.state !== 'GAME_OVER') {
                const scorer = this.ui.goalBanner.textContent.includes("YOU") ? 'ai' : 'player';
                this.resetTable(scorer);
                this.state = 'PLAYING';
              }
            }
          }

          this.updateParticles();
          this.draw();

          requestAnimationFrame(this.loop);
        }
      }

      // Initialize on load
      window.addEventListener('DOMContentLoaded', () => {
        new AirHockeyGame();
      });
    </script>
  </body>
</html>
